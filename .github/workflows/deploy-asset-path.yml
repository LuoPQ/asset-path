name: Deploy asset path to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - asset-path.html
      - apple-touch-icon.png
      - icon-192.png
      - icon-512.png
      - site.webmanifest
      - .github/workflows/deploy-asset-path.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp asset-path.html _site/index.html
          cp asset-path.html _site/asset-path.html
          cp apple-touch-icon.png _site/apple-touch-icon.png
          cp icon-192.png _site/icon-192.png
          cp icon-512.png _site/icon-512.png
          cp site.webmanifest _site/site.webmanifest
          touch _site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
